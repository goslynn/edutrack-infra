# Ingress resources — EduTrack Auth Service
# Kong Ingress Controller 3.x
#
# Prerequisitos:
#   kubectl apply -f k8s/kongplugins.yaml  # plugins deben existir primero
#   kubectl apply -f k8s/ingress.yaml
#
# El ALB externo termina TLS; Kong actúa como proxy interno ClusterIP.
# Los microservicios NO exponen puertos fuera del cluster.
---
# ─── Auth Service — rutas públicas (sin JWT) ──────────────────────────────────
# POST /auth/login, POST /auth/refresh, GET /.well-known/jwks.json
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-public
  namespace: edutrack
  annotations:
    kubernetes.io/ingress.class: kong
    # Solo rate limiting y correlation-id — sin validación JWT
    konghq.com/plugins: edutrack-rate-limiting,edutrack-correlation-id
    konghq.com/strip-path: "false"
spec:
  rules:
    - http:
        paths:
          - path: /auth/login
            pathType: Exact
            backend:
              service:
                name: auth
                port:
                  number: 8080
          - path: /auth/refresh
            pathType: Exact
            backend:
              service:
                name: auth
                port:
                  number: 8080
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service:
                name: auth
                port:
                  number: 8080
---
# ─── Auth Service — rutas protegidas (con JWT) ────────────────────────────────
# Toda ruta /auth/* que no sea login/refresh/logout público.
# El plugin jwt valida firma y expiración.
# El plugin post-function inyecta X-User-Id y X-User-Roles.
#
# IMPORTANTE: este Ingress tiene menor prioridad que auth-public.
# Kong evalúa rutas más específicas primero (Exact > Prefix).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-protected
  namespace: edutrack
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/plugins: edutrack-rate-limiting,edutrack-correlation-id,edutrack-jwt,edutrack-jwt-claims-propagation
    konghq.com/strip-path: "false"
spec:
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8080
