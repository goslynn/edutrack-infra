version: "3.9"

# API Gateway — Kong DB-less
#
# Este compose levanta ÚNICAMENTE el gateway. Cada microservicio corre
# en su propio compose y se conecta a la red 'edutrack' como red externa:
#
#   networks:
#     edutrack:
#       external: true
#
# Prerequisito: copiar .env.example → .env y ajustar KONG_RSA_PUBLIC_KEY.

services:

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yaml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: info
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_RSA_PUBLIC_KEY: "${KONG_RSA_PUBLIC_KEY}"
    volumes:
      - ./kong/kong.yaml:/usr/local/kong/declarative/kong.yaml:ro
      - ./kong/lua:/usr/local/kong/lua:ro
    ports:
      - "8080:8000"    # Punto de entrada único para todo el tráfico API
      - "8001:8001"    # Admin API (solo dev; no exponer en prod)
    networks:
      - edutrack
    restart: on-failure
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edutrack:
    name: edutrack
    driver: bridge
