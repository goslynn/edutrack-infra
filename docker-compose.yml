version: "3.9"

# API Gateway — desarrollo local
#
# Prerequisito: copiar .env.example → .env y completar las variables.
# Los microservicios se conectan a esta red desde sus propios composes:
#
#   networks:
#     edutrack:
#       external: true

services:

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: edutrack/gateway:local
    env_file: .env
    environment:
      UPSTREAM_HOST_PATTERN: "{service}:8080"
      JWKS_SERVICE: "auth"
      # Clave pública RS256 leída desde el archivo montado (no PEM en .env).
      #   El entrypoint carga su contenido en JWT_PUBLIC_KEY antes de arrancar.
      JWT_PUBLIC_KEY_FILE: .certs/publicKey.pem
    volumes:
      # Directorio de certs (gitignored) montado read-only: fuente local de la
      #   clave pública con la que el gateway valida los JWT emitidos por Auth.
      #   Convención: directorio oculto `.certs/` (igual que en auth/).
      - ./.certs:/.certs:ro
    ports:
      - "8080:8080"    # Punto de entrada único
    networks:
      - edutrack
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edutrack:
    name: edutrack
    driver: bridge
    # Subred/gateway fijos (dev): el gateway 172.18.0.1 es la IP del HOST vista
    #   desde cualquier contenedor de esta red. Los MS apuntan su DB_HOST ahí
    #   (Postgres del host escucha en esa interfaz). Fijarlo evita que un
    #   `compose down` reasigne otra subred y rompa la conexión a la DB del host.
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
