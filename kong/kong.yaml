## Kong Gateway — configuración declarativa DB-less
## EduTrack Auth Service v1
##
## USO LOCAL:
##   cp .env.example .env           # y ajusta KONG_RSA_PUBLIC_KEY con el contenido del .pem
##   docker-compose up -d
##
## USO EKS:
##   El mismo archivo se monta como ConfigMap. La llave pública se gestiona
##   vía KongConsumer + K8s Secret (ver k8s/kongplugins.yaml).
##
_format_version: "3.0"
_transform: true

# ─── Vault: lee secretos desde variables de entorno ──────────────────────────
# KONG_RSA_PUBLIC_KEY debe contener el PEM completo de la clave pública RS256.
vaults:
  - name: env
    prefix: env

# ─── Consumer necesario para el plugin JWT ───────────────────────────────────
consumers:
  - username: edutrack-jwt-issuer

jwt_secrets:
  - consumer: edutrack-jwt-issuer
    algorithm: RS256
    # Debe coincidir con el claim 'iss' de los tokens emitidos por Auth Service.
    # Configurado en application.properties: mp.jwt.issuer=edutrack-auth
    key: edutrack-auth
    rsa_public_key: "{vault://env/KONG_RSA_PUBLIC_KEY}"

# ─── Upstreams con health checks (circuit breaker nivel gateway) ─────────────
upstreams:
  - name: auth-upstream
    targets:
      - target: auth:8080
        weight: 100
    healthchecks:
      active:
        type: http
        http_path: /q/health/live
        concurrency: 2
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
      passive:
        healthy:
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 3

# ─── Servicios ───────────────────────────────────────────────────────────────
services:

  # Endpoints públicos: no requieren JWT
  - name: auth-public
    host: auth-upstream
    port: 80
    protocol: http
    routes:
      - name: auth-login
        paths:
          - ~/auth/login$
        methods: [POST]
        strip_path: false
      - name: auth-refresh
        paths:
          - ~/auth/refresh$
        methods: [POST]
        strip_path: false
      - name: auth-jwks
        paths:
          - ~/.well-known/jwks.json$
        methods: [GET]
        strip_path: false

  # Endpoints protegidos: requieren JWT válido (RS256, iss=edutrack-auth, exp válido)
  - name: auth-protected
    host: auth-upstream
    port: 80
    protocol: http
    routes:
      - name: auth-protected-route
        paths:
          - ~/auth
        methods: [GET, POST, PUT, DELETE]
        strip_path: false
        # Prioridad más baja que las rutas públicas para que no capturen /auth/login y /auth/refresh
        regex_priority: 0
    plugins:
      - name: jwt
        config:
          uri_param_names: []
          cookie_names: []
          key_claim_name: iss
          claims_to_verify:
            - exp

      # Corre DESPUÉS de la validación JWT (post-function priority=0 < jwt priority=1005).
      - name: post-function
        config:
          access:
            - "dofile('/usr/local/kong/lua/jwt_claims_propagation.lua')"

# ─── Plugins globales (aplican a todos los servicios) ────────────────────────
plugins:

  # Rate limiting: 200 req/min por IP
  # En producción usar policy: redis para estado compartido entre réplicas de Kong.
  - name: rate-limiting
    config:
      minute: 200
      policy: local
      limit_by: ip
      hide_client_headers: false

  # Correlation ID para trazabilidad distribuida
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid#counter
      echo_downstream: true
